name: Hourly forecast

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r jobs/requirements.txt
      # jobs/refresh_forecast.py is written by Person A on 13 Oct.
      - run: python jobs/refresh_forecast.py
        if: hashFiles('jobs/refresh_forecast.py') != ''
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
